repos:
  - repo: local
    hooks:
      - id: black
        name: black (Python 格式化)
        entry: black
        language: system
        types: [python]

      - id: prettier
        name: prettier (前端格式化)
        entry: prettier --write
        language: system
        types_or: [javascript, jsx, ts, tsx, css, html, json]
