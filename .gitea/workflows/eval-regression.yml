# 评测回归基线 CI：提示词 / 模型 / 解析器 / 评测工具变更后自动跑评测并与基线比对。
#
# 三档 job：
#   - offline-gate：零成本离线门禁（语料校验 + 网络访问评测离线重放 + 基线比对）
#   - llm-evals：LLM 语料评测四套 + Prompt 理解评测（需 secrets.LX_LLM_KEY，未配置自动跳过）
#   - ocr-evals：公式/表格 OCR 评测（需 Vision 模型 + TeX Live，仅定时全量或手动触发）
#
# Gitea Actions 要求：
#   - Gitea ≥ 1.22（artifact v4 API；workflow_dispatch inputs 建议 ≥ 1.23）
#   - 自托管 act_runner，标签 ubuntu-latest 需映射到含 Python 3.12 + node20 的全量镜像
#     （如 catthehacker/ubuntu:act-latest 或 gitea/runner-images:ubuntu-latest）；
#     ocr-evals job 还需镜像支持 apt-get 安装 TeX Live
#   - 定时触发由 Gitea 服务端发出，届时需有 runner 在线
#   - 内网隔离实例无法拉取 actions/checkout 等 GitHub action 时，
#     将实例配置 DEFAULT_ACTIONS_URL 改为 self 并镜像所需 action，或改用绝对 URL
#
# 本文件语法与 GitHub Actions 兼容：若仓库镜像回 GitHub，复制回 .github/workflows/ 即可
# （注意 Gitea 优先读 .gitea/workflows/、仅在其为空时回退 .github/workflows/，两处不要并存各一份）。
#
# 触发路径、基线治理与阈值调优见 docs/eval-regression-ci.md。

name: eval-regression

on:
  pull_request:
    paths:
      - "backend/core/prompts.py"
      - "backend/core/llm_client.py"
      - "backend/core/base_paragraph_check.py"
      - "backend/utils/latex_parser.py"
      - "backend/utils/json_utils.py"
      - "backend/utils/latex_json_guard.py"
      - "backend/modules/typo_check/**"
      - "backend/modules/expression_opt/**"
      - "backend/modules/terminology_check/**"
      - "backend/modules/paragraph_translate/**"
      - "backend/modules/formula_ocr/**"
      - "backend/modules/table_ocr/**"
      - "tests/fixtures/typo_check/**"
      - "tests/fixtures/expression_opt/**"
      - "tests/fixtures/terminology_check/**"
      - "tests/fixtures/paragraph_translate/**"
      - "tests/fixtures/formula_ocr/**"
      - "tests/fixtures/table_ocr/**"
      - "tools/eval_common.py"
      - "tools/typo_check_eval/**"
      - "tools/expression_opt_eval/**"
      - "tools/terminology_check_eval/**"
      - "tools/paragraph_translate_eval/**"
      - "tools/formula_ocr_eval/**"
      - "tools/table_ocr_eval/**"
      - "tools/prompt_comprehension_eval/**"
      - "tools/web_access_eval/**"
      - "tools/ci/**"
      - "config.example.json"
      - ".gitea/workflows/eval-regression.yml"
  push:
    branches: [master]
    paths:
      - "backend/core/prompts.py"
      - "backend/core/llm_client.py"
      - "backend/core/base_paragraph_check.py"
      - "backend/utils/latex_parser.py"
      - "backend/utils/json_utils.py"
      - "backend/utils/latex_json_guard.py"
      - "backend/modules/typo_check/**"
      - "backend/modules/expression_opt/**"
      - "backend/modules/terminology_check/**"
      - "backend/modules/paragraph_translate/**"
      - "backend/modules/formula_ocr/**"
      - "backend/modules/table_ocr/**"
      - "tests/fixtures/typo_check/**"
      - "tests/fixtures/expression_opt/**"
      - "tests/fixtures/terminology_check/**"
      - "tests/fixtures/paragraph_translate/**"
      - "tests/fixtures/formula_ocr/**"
      - "tests/fixtures/table_ocr/**"
      - "tools/eval_common.py"
      - "tools/typo_check_eval/**"
      - "tools/expression_opt_eval/**"
      - "tools/terminology_check_eval/**"
      - "tools/paragraph_translate_eval/**"
      - "tools/formula_ocr_eval/**"
      - "tools/table_ocr_eval/**"
      - "tools/prompt_comprehension_eval/**"
      - "tools/web_access_eval/**"
      - "tools/ci/**"
      - "config.example.json"
      - ".gitea/workflows/eval-regression.yml"
  # 每周一 02:00 UTC 全量回归（含 OCR）：捕捉 base_url 指向的托管模型自行升级导致的漂移
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      run_llm:
        description: "运行 LLM 评测（语料四套 + Prompt 理解）"
        type: boolean
        default: true
      run_ocr:
        description: "运行 OCR 评测（需 Vision 模型，job 内安装 TeX Live）"
        type: boolean
        default: false
      update_baseline:
        description: "把本次结果更新为基线（生成 artifact，人工审核 diff 后提交）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eval-regression-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EVAL_METRICS_DIR: logs/ci/metrics
  EVAL_BASELINES_DIR: tools/ci/baselines

jobs:
  offline-gate:
    name: 离线门禁（语料校验 + 网络访问重放）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 语料与用例离线校验
        run: |
          python tools/terminology_check_eval/run_eval.py --validate
          python tools/paragraph_translate_eval/run_eval.py --validate
          python tools/prompt_comprehension_eval/run_eval.py --dry-run
          python tools/web_access_eval/run_eval.py validate
      - name: 网络访问评测离线重放
        run: |
          mkdir -p "$EVAL_METRICS_DIR" logs/ci/web
          python tools/web_access_eval/run_eval.py replay \
            --dataset tools/web_access_eval/datasets/search.json \
            --predictions tools/web_access_eval/results/legacy-search.json \
            --output logs/ci/web/search-report.json
          python tools/web_access_eval/run_eval.py replay \
            --dataset tools/web_access_eval/datasets/scholarly.json \
            --predictions tools/web_access_eval/results/legacy-scholarly.json \
            --output logs/ci/web/scholarly-report.json
          python tools/web_access_eval/run_eval.py replay \
            --dataset tools/web_access_eval/datasets/extraction.json \
            --predictions tools/web_access_eval/results/legacy-extraction.json \
            --output logs/ci/web/extraction-report.json
          python tools/web_access_eval/run_eval.py collect-structured-extraction \
            --dataset tools/web_access_eval/datasets/extraction.json \
            --output logs/ci/web/structured-predictions.json
          python tools/web_access_eval/run_eval.py replay \
            --dataset tools/web_access_eval/datasets/extraction.json \
            --predictions logs/ci/web/structured-predictions.json \
            --output logs/ci/web/extraction_structured-report.json
          python tools/ci/collect_metrics.py --suite web_search \
            --results logs/ci/web/search-report.json --output "$EVAL_METRICS_DIR/web_search.json"
          python tools/ci/collect_metrics.py --suite web_scholarly \
            --results logs/ci/web/scholarly-report.json --output "$EVAL_METRICS_DIR/web_scholarly.json"
          python tools/ci/collect_metrics.py --suite web_extraction \
            --results logs/ci/web/extraction-report.json --output "$EVAL_METRICS_DIR/web_extraction.json"
          python tools/ci/collect_metrics.py --suite web_extraction_structured \
            --results logs/ci/web/extraction_structured-report.json --output "$EVAL_METRICS_DIR/web_extraction_structured.json"
      - name: 基线比对
        run: |
          ARGS=""
          if [ "${{ inputs.update_baseline || 'false' }}" = "true" ]; then ARGS="--update-baseline"; fi
          python tools/ci/compare_metrics.py \
            --metrics-dir "$EVAL_METRICS_DIR" --baselines-dir "$EVAL_BASELINES_DIR" \
            --output logs/ci/regression_report.json $ARGS
      - name: 上传评测产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-offline-artifacts
          path: |
            logs/ci/
            tools/ci/baselines/
          retention-days: 14

  llm-evals:
    name: LLM 评测回归（语料四套 + Prompt 理解）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_llm) ||
      github.event_name == 'pull_request' ||
      github.event_name == 'push'
    outputs:
      should_run: ${{ steps.check_key.outputs.should_run }}
    env:
      LX_LLM_KEY: ${{ secrets.LX_LLM_KEY }}
      LATEXCELLENCE_CI_LLM_BASE_URL: ${{ vars.EVAL_LLM_BASE_URL }}
      LATEXCELLENCE_CI_LLM_MODEL: ${{ vars.EVAL_LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 检查 LLM Key
        id: check_key
        run: |
          if [ -z "$LX_LLM_KEY" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 secrets.LX_LLM_KEY，本次跳过 LLM 评测。配置方法见 docs/eval-regression-ci.md。"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 生成评测用 config.json
        if: steps.check_key.outputs.should_run == 'true'
        run: python tools/ci/build_config.py
      - name: LLM 连通性探测
        if: steps.check_key.outputs.should_run == 'true'
        run: python tools/ci/llm_probe.py
      - name: 语料评测（错字/表达/术语/翻译）
        if: steps.check_key.outputs.should_run == 'true'
        run: |
          python tools/typo_check_eval/run_eval.py --output-dir logs/ci/typo_check
          python tools/expression_opt_eval/run_eval.py --output-dir logs/ci/expression_opt
          python tools/terminology_check_eval/run_eval.py --output-dir logs/ci/terminology_check
          python tools/paragraph_translate_eval/run_eval.py --output-dir logs/ci/paragraph_translate
      - name: Prompt 理解评测
        if: steps.check_key.outputs.should_run == 'true'
        run: |
          mkdir -p logs/ci/prompt_comprehension
          python tools/prompt_comprehension_eval/run_eval.py \
            --out logs/ci/prompt_comprehension/results.json --concurrency 4
      - name: 采集指标
        if: steps.check_key.outputs.should_run == 'true'
        run: |
          mkdir -p "$EVAL_METRICS_DIR"
          python tools/ci/collect_metrics.py --suite typo_check \
            --results logs/ci/typo_check/results.json --output "$EVAL_METRICS_DIR/typo_check.json"
          python tools/ci/collect_metrics.py --suite expression_opt \
            --results logs/ci/expression_opt/results.json --output "$EVAL_METRICS_DIR/expression_opt.json"
          python tools/ci/collect_metrics.py --suite terminology_check \
            --results logs/ci/terminology_check/results.json --output "$EVAL_METRICS_DIR/terminology_check.json"
          python tools/ci/collect_metrics.py --suite paragraph_translate \
            --results logs/ci/paragraph_translate/results.json --output "$EVAL_METRICS_DIR/paragraph_translate.json"
          python tools/ci/collect_metrics.py --suite prompt_comprehension \
            --results logs/ci/prompt_comprehension/results.json --output "$EVAL_METRICS_DIR/prompt_comprehension.json"
      - name: 基线比对
        if: steps.check_key.outputs.should_run == 'true'
        run: |
          ARGS=""
          if [ "${{ inputs.update_baseline || 'false' }}" = "true" ]; then ARGS="--update-baseline"; fi
          python tools/ci/compare_metrics.py \
            --metrics-dir "$EVAL_METRICS_DIR" --baselines-dir "$EVAL_BASELINES_DIR" \
            --output logs/ci/regression_report.json $ARGS
      - name: 上传评测产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-llm-artifacts
          path: |
            logs/ci/
            tools/ci/baselines/
          retention-days: 14

  ocr-evals:
    name: OCR 评测回归（公式/表格）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_ocr)
    outputs:
      should_run: ${{ steps.check_key.outputs.should_run }}
    env:
      LX_LLM_KEY: ${{ secrets.LX_LLM_KEY }}
      LATEXCELLENCE_CI_LLM_BASE_URL: ${{ vars.EVAL_LLM_BASE_URL }}
      LATEXCELLENCE_CI_LLM_MODEL: ${{ vars.EVAL_LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 安装 TeX Live 与 poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: 检查 LLM Key
        id: check_key
        run: |
          if [ -z "$LX_LLM_KEY" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 secrets.LX_LLM_KEY，本次跳过 OCR 评测。"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 生成评测用 config.json
        if: steps.check_key.outputs.should_run == 'true'
        run: python tools/ci/build_config.py
      - name: LLM 连通性探测
        if: steps.check_key.outputs.should_run == 'true'
        run: python tools/ci/llm_probe.py
      - name: 公式 OCR 评测
        if: steps.check_key.outputs.should_run == 'true'
        run: python tools/formula_ocr_eval/run_eval.py --output-dir logs/ci/formula_ocr
      - name: 表格 OCR 评测
        if: steps.check_key.outputs.should_run == 'true'
        run: python tools/table_ocr_eval/run_eval.py --output-dir logs/ci/table_ocr
      - name: 采集指标
        if: steps.check_key.outputs.should_run == 'true'
        run: |
          mkdir -p "$EVAL_METRICS_DIR"
          python tools/ci/collect_metrics.py --suite formula_ocr \
            --results logs/ci/formula_ocr/results.json --output "$EVAL_METRICS_DIR/formula_ocr.json"
          python tools/ci/collect_metrics.py --suite table_ocr \
            --results logs/ci/table_ocr/results.json --output "$EVAL_METRICS_DIR/table_ocr.json"
      - name: 基线比对
        if: steps.check_key.outputs.should_run == 'true'
        run: |
          ARGS=""
          if [ "${{ inputs.update_baseline || 'false' }}" = "true" ]; then ARGS="--update-baseline"; fi
          python tools/ci/compare_metrics.py \
            --metrics-dir "$EVAL_METRICS_DIR" --baselines-dir "$EVAL_BASELINES_DIR" \
            --output logs/ci/regression_report.json $ARGS
      - name: 上传评测产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-ocr-artifacts
          path: |
            logs/ci/
            tools/ci/baselines/
          retention-days: 14
