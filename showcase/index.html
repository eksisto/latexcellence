<!doctype html>
<html lang="zh-CN" data-theme="jingtailan">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LateXcellence - 展示页</title>
    <meta
      name="description"
      content="LateXcellence — 让技术退居幕后，让思想落于纸上。"
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://s4.zstatic.net/ajax/libs/lxgw-wenkai-web/1.520.0/lxgwwenkai-regular/result.css"
    />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/showcase.css" />
    <link rel="stylesheet" href="css/scrolly.css" />
  </head>
  <body>

        />

          d="M12 22a10 10 0 1 1 10-10c0 1.5-1 2.5-2.5 2.5H17a2 2 0 0 0-1.5 3.3c.3.4.5.8.5 1.2 0 1.1-.9 2-2 2Z"
        />
        <circle cx="7.5" cy="10.5" r="1" />
        <circle cx="12" cy="7.5" r="1" />
        <circle cx="16.5" cy="10.5" r="1" />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2" />
        <path d="M12 20v2" />

        <path d="m17.66 17.66 1.41 1.41" />

      <symbol id="i-bot" viewBox="0 0 24 24">
        <path d="M12 8V4H8" />

        <path d="M9 13v2" />

      <symbol id="i-gauge" viewBox="0 0 24 24">
        <path d="m12 14 4-4" />
        <path d="M3.34 19a10 10 0 1 1 17.32 0" />
      </symbol>
      <symbol id="i-zap" viewBox="0 0 24 24">

          d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"
        />

      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M12 5v14" />
        <path d="m19 12-7 7-7-7" />
      </symbol>
      <symbol id="i-up" viewBox="0 0 24 24">
        <path d="M12 19V5" />
        <path d="m5 12 7-7 7 7" />
      </symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24">
        <polyline points="4 17 10 11 4 5" />
        <line x1="12" y1="19" x2="20" y2="19" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <path d="m9 11 3 3L22 4" />
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
        <path d="M3 21v-5h5" />
      </symbol>
      <symbol id="i-corner" viewBox="0 0 24 24">
        <path d="M3 21V5a2 2 0 0 1 2-2h16" />
      </symbol>
    </svg>
    <!-- ===== 编译状态角标（跟随滚动，结尾显示编译通过） ===== -->
    <div class="compile-chip" id="compileChip" aria-hidden="true">
      <svg class="icon"><use href="#i-refresh" /></svg
      ><span id="compileText">compiling…</span>
    </div>

    <!-- ===== 顶部编译进度条 ===== -->
    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- ===== 左侧行号栏（编辑器隐喻：整页是一份 intro.tex） ===== -->
    <div class="line-gutter" aria-hidden="true">
      <div class="lg-file">intro.tex</div>
      <div class="lg-numbers" id="lgNumbers"></div>
    </div>

    <!-- ===== 右侧章节导轨（由 js/render.js 按 js/content.js 的 NAV 生成） ===== -->
    <nav class="scene-rail" id="sceneRail" aria-label="章节导航"></nav>

    <!-- ===== 顶部工具栏（同 App 的 ThemeSwitcher + ThemeToggle；选项由 render.js 生成） ===== -->
    <div class="toolbar">
      <div class="theme-switcher">
        <button
          class="icon-btn"
          id="themeBtn"
          type="button"
          title="切换主题"
          aria-label="切换主题"
          aria-haspopup="true"
        >
          <svg class="icon"><use href="#i-palette" /></svg>
        </button>
        <div class="theme-popover" id="themePopover" hidden></div>
      </div>
      <button
        class="icon-btn"
        id="darkBtn"
        type="button"
        title="切换明暗"
        aria-label="切换明暗"
      >
        <svg class="icon" id="darkIcon"><use href="#i-moon" /></svg>
      </button>
    </div>

    <!-- ===== 全部场景（由 js/render.js 按 js/content.js 的 SCENES 生成） ===== -->
    <main class="stage" id="scenes"></main>

    <!-- ===== Colophon ===== -->
    <footer class="colophon">
      <div class="container colophon-inner">
        <span class="wordmark-sm">LaTeXcellence</span>
        <span class="meta">FastAPI · React · LLM Agent</span>
      </div>
    </footer>

    <script type="module" src="js/render.js"></script>
    <script type="module" src="js/showcase.js"></script>
    <script type="module" src="js/scrolly.js"></script>
  </body>
</html>
